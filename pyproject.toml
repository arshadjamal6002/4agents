[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not eval'"

markers = [
    "unit: fast tests, no external dependencies",
    "eval: slow evaluation tests requiring an LLM",
]

[tool.pyright]
pythonPath = "src"
